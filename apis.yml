aid: trinity-college-dublin
name: Trinity College Dublin
x-type: university
x-category: Public Research University
description: >-
  Trinity College Dublin, the University of Dublin, founded in 1592, is Ireland's oldest
  university and a legal deposit library for Ireland and the United Kingdom since 1801.
  Trinity operates no public developer portal, publishes no OpenAPI, issues no API keys and
  runs no documented open-API programme — and this profile says so rather than padding the
  gap. What Trinity does operate, and what is recorded here, is standards-based scholarly and
  identity infrastructure: a self-hosted Shibboleth Identity Provider on its own domain
  (idp.tcd.ie, scope tcd.ie) registered in HEAnet's Edugate federation and exported to
  eduGAIN; a Microsoft Entra ID tenant with live OIDC discovery; an OpenSearch 1.1 description
  document authored by Trinity's own Digital and Web team; DataCite consortium membership with
  five prefixes and 16,031 DOIs across five registered repositories; and Crossref membership.
  Its two flagship repositories — TARA (DSpace) and Digital Collections (Hyrax/Samvera, home of
  the Book of Kells) — sit on Trinity's own hosts but are fronted by Cloudflare and F5
  bot-mitigation that returns a challenge to every unattended client, so they are live but not
  machine-callable. eDeposit Ireland, the national legal-deposit repository Trinity Library
  administers, is the one repository that answers a harvester, and it does so as a tenant on
  Atmire's Open Repository platform rather than as Trinity's own engineering.
