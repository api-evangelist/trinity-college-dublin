x-coverage:
  state: gated
  reason: bot_blocked
  detail: >-
    Trinity's two institution-operated repository surfaces — TARA at www.tara.tcd.ie and
    Digital Collections at digitalcollections.tcd.ie — are both reachable in a browser and both
    refuse unattended clients. TARA returns a Cloudflare 403 interstitial on every path,
    including /oai/request and /server/oai/request. Digital Collections returns a soft-200
    reCAPTCHA page from an F5 Distributed Cloud edge on every path, including /robots.txt and
    IIIF manifest URLs, so the 200 is not evidence of a readable surface. Neither is dead and
    neither is an authentication wall; both are bot mitigation. Everything reachable WAS read:
    the Shibboleth IdP metadata, the Entra ID OIDC and SAML metadata, the OpenSearch descriptor,
    the eDeposit Ireland OAI-PMH Identify/ListMetadataFormats/ListSets responses and the DSpace
    REST root, and the DataCite, Crossref and ROR registry records. Beyond that there is simply
    nothing to find: api.tcd.ie, data.tcd.ie and developer.tcd.ie do not resolve, and
    www.tcd.ie/llms.txt returns 404.
